name: Sharnou IDE Policy

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  policy:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate IDE stack policy
        shell: powershell
        run: .\ci\sharnou-ide-policy.ps1